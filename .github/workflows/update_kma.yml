name: KMA forecast feed

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "locations.csv"
      - "assets/**"
      - ".github/workflows/update_kma.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "locations.csv"
      - "assets/**"
      - ".github/workflows/update_kma.yml"
  schedule:
    # Six staggered chances before every :30 ChatGPT alert (UTC -> KST).
    # KST 05/11/17/23:33,43,53 and 06/12/18/00:03,13,23
    # GitHub scheduled jobs are best effort: an individual run may be dropped.
    # Already-current PDF issues are skipped before any nationwide API requests.
    - cron: '33,43,53 2,8,14,20 * * *'
    - cron: '3,13,23 3,9,15,21 * * *'

permissions:
  contents: write

concurrency:
  # PR validation must never queue or cancel time-critical forecast collection.
  group: ${{ github.event_name == 'pull_request' && format('kma-pr-{0}', github.event.pull_request.number) || 'kma-forecast-feed' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate_pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate unchanged KMA baseline plus new gu scope
        run: python -m unittest discover -s tests -v
      - name: Render example PDF with a real-data KMA source and a synthetic test-only gu model
        run: |
          python -m pip install --quiet "reportlab>=4.0,<5"
          if [ ! -f /usr/share/fonts/truetype/nanum/NanumGothic.ttf ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq fonts-nanum
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("data")
          kma=json.loads((root/"latest.json").read_text(encoding="utf-8"))
          model=json.loads((root/"ecmwf_regional.json").read_text(encoding="utf-8"))
          model["generated_at_kst"]=kma["generated_at_kst"]
          date=kma["issue_at_kst"][:10]
          model["district_models"]={
            "IFS":{"status":"verified","cities_requested":109,
                   "cities_succeeded":1,"records":[{
                     "city":"서울특별시 강남구",
                     "days":{date:{"forecast_hours":24,"precip_mm":1.2,
                                   "snowfall_cm":0.0,"snowfall_valid":True}}
                   }]}}
          (root/"ecmwf_regional.json").write_text(
              json.dumps(model,ensure_ascii=False),encoding="utf-8")
          PY
          # Regenerate every derived source from the same PR snapshot,
          # so the real pre-publication integrity gate is also tested offline.
          python scripts/create_precip_report.py
          python scripts/ecmwf_coverage_audit.py
          python scripts/model_agreement_7day.py
          python scripts/forecast_skill_snapshot.py /tmp/pr-test-weather-snapshot.jsonl
          python scripts/create_city_pdf.py
          python scripts/create_alert_status.py
          python scripts/validate_generated_outputs.py
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("data/pdf_manifest.json").read_text(encoding="utf-8"))
          assert m["scope"]=="city_only",m
          assert m["coverage_scope"]=="city_district_county",m
          assert m["ecmwf_gu_models_included"],m
          assert m["pdf_layout_version"]=="unified_kma_ecmwf_v1_coverage_audit",m
          assert m["kma_unified_date_rows"]>=m["kma_gu_date_rows"],m
          assert m["ecmwf_unified_date_rows"]>=1,m
          assert m["ecmwf_kma_coverage_rows"]==m["kma_unified_date_rows"],m
          assert Path("data/rain_snow_latest.pdf").read_bytes()[:5]==b"%PDF-"
          print("PDF_UNIFIED_LAYOUT_PASS",
                "kma_rows",m["kma_unified_date_rows"],
                "ecmwf_rows",m["ecmwf_unified_date_rows"],
                "bytes",m["pdf_size_bytes"])
          PY
  collect:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check if current published PDF already matches latest KMA issue
        id: freshness
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          # One-shot explicit recovery, never on ordinary code deployments.
          KMA_ONE_SHOT_RECOVERY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[kma-recovery]') }}
        run: python scripts/check_freshness.py >> "$GITHUB_OUTPUT"
      - name: Validate collector
        if: steps.freshness.outputs.needed == 'true' || steps.freshness.outputs.ecmwf_retry == 'true' || steps.freshness.outputs.render_only == 'true'
        run: python -m unittest discover -s tests -v
      - name: Import official nationwide KMA grid mapping (if uploaded)
        if: steps.freshness.outputs.needed == 'true'
        run: |
          if [ -f assets/kma_grid_mapping.xlsx ]; then
            python -m pip install --disable-pip-version-check openpyxl
            python scripts/import_kma_grid.py assets/kma_grid_mapping.xlsx
          elif [ -f assets/kma_grid_mapping.csv ]; then
            python scripts/import_kma_grid.py assets/kma_grid_mapping.csv
          else
            echo "No official grid file uploaded; keeping verified representative sample."
          fi
      - name: Validate official city and county scope
        if: steps.freshness.outputs.needed == 'true'
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,"scripts")
          from fetch_kma import load_locations
          from ecmwf_city_locations import build_city_locations, build_district_locations
          a=load_locations()
          lev={k:sum(x["level"]==k for x in a) for k in ("gu","city","gun")}
          n=len(build_city_locations())
          ng=len(build_district_locations())
          print("KMA official gu/city/gun:",lev,"ECMWF city/county:",n,"districts:",ng)
          assert len(a)==256 and lev=={"gu":109,"city":65,"gun":82} and n==167 and ng==109
          PY
      - name: Fetch official KMA forecasts
        if: steps.freshness.outputs.needed == 'true'
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
        run: python scripts/fetch_kma.py
      - name: Publish rain/snow forecast regions only (all qualifying regions, no TOP limit)
        if: steps.freshness.outputs.needed == 'true' || steps.freshness.outputs.render_only == 'true'
        run: python scripts/create_precip_report.py
      - name: Check independent ECMWF IFS / AIFS model availability
        if: steps.freshness.outputs.ecmwf_fetch == 'true'
        run: python scripts/fetch_ecmwf.py
      - name: Audit KMA wet-region ECMWF coverage and publish missing-region diagnostics
        if: steps.freshness.outputs.needed == 'true' || steps.freshness.outputs.ecmwf_retry == 'true' || steps.freshness.outputs.render_only == 'true'
        run: |
          python scripts/ecmwf_coverage_audit.py
          test -s data/ecmwf_kma_coverage.md
          test -s data/ecmwf_kma_coverage.csv
      - name: Generate evidence-aware seven-day model comparison without provider calls
        if: steps.freshness.outputs.needed == 'true' || steps.freshness.outputs.ecmwf_retry == 'true' || steps.freshness.outputs.render_only == 'true'
        run: |
          python scripts/model_agreement_7day.py
          test -s data/model_agreement_7day.md
      - name: Generate date-sorted city/county rain/snow summary
        if: steps.freshness.outputs.needed == 'true' || steps.freshness.outputs.ecmwf_retry == 'true' || steps.freshness.outputs.render_only == 'true'
        run: |
          python scripts/city_forecast.py
          test -s data/city_precipitation.md
          test -s data/city_precipitation.csv
      - name: Generate city/county PDF with verified ECMWF appendix
        if: steps.freshness.outputs.needed == 'true' || steps.freshness.outputs.ecmwf_retry == 'true' || steps.freshness.outputs.render_only == 'true'
        run: |
          python -m pip install --quiet "reportlab>=4.0,<5"
          if [ ! -f /usr/share/fonts/truetype/nanum/NanumGothic.ttf ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq fonts-nanum
          fi
          python -m py_compile scripts/create_city_pdf.py
          python scripts/create_city_pdf.py
          test -s data/rain_snow_latest.pdf
          test "$(head -c 5 data/rain_snow_latest.pdf)" = "%PDF-"
      - name: Verify PDF and publish deterministic reminder readiness
        if: steps.freshness.outputs.needed == 'true' || steps.freshness.outputs.ecmwf_retry == 'true' || steps.freshness.outputs.render_only == 'true' || steps.freshness.outputs.status_only == 'true'
        run: |
          python scripts/create_alert_status.py
          test -s data/alert_status.json
      - name: Check cross-file region/model coverage integrity before publishing
        if: steps.freshness.outputs.needed == 'true' || steps.freshness.outputs.ecmwf_retry == 'true' || steps.freshness.outputs.render_only == 'true' || steps.freshness.outputs.status_only == 'true'
        run: python scripts/validate_generated_outputs.py
      - name: Preserve timestamped forecasts for future observation-based verification
        id: skill_snapshot
        if: steps.freshness.outputs.needed == 'true' || steps.freshness.outputs.ecmwf_fetch == 'true'
        env:
          FORECAST_SNAPSHOT_KMA: ${{ steps.freshness.outputs.needed }}
          FORECAST_SNAPSHOT_ECMWF: ${{ steps.freshness.outputs.ecmwf_fetch }}
        run: |
          python scripts/forecast_skill_snapshot.py /tmp/weather-forecast-snapshot.jsonl
          if [ -s /tmp/weather-forecast-snapshot.jsonl ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "No genuinely new forecast samples to archive; publishing may proceed."
          fi
      - name: Archive snapshots independently of published PDF and main branch history
        if: steps.skill_snapshot.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: forecast-skill-snapshot-${{ github.run_id }}
          path: /tmp/weather-forecast-snapshot.jsonl
          if-no-files-found: error
          retention-days: 30
      - name: Safely publish PDF and forecast data even when code changed
        if: steps.freshness.outputs.needed == 'true' || steps.freshness.outputs.ecmwf_retry == 'true' || steps.freshness.outputs.render_only == 'true' || steps.freshness.outputs.status_only == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATA_FILES=(
            locations.csv
            data/latest.json data/summary.md data/all_regions.md data/all_regions.csv
            data/precipitation_only.md data/precipitation_only.csv
            data/city_precipitation.md data/city_precipitation.csv
            data/rain_snow_latest.pdf data/pdf_manifest.json data/alert_status.json
            data/ecmwf_regional.json data/ecmwf_last_verified.json data/source_status.md
            data/ecmwf_kma_coverage.md data/ecmwf_kma_coverage.csv
            data/model_agreement_7day.md
          )
          git add "${DATA_FILES[@]}"
          if git diff --cached --quiet; then
            echo "No generated data changes"
            exit 0
          fi
          git commit -m "Stage generated KMA rain/snow PDF and forecasts"
          GENERATED_COMMIT="$(git rev-parse HEAD)"
          GENERATED_TIME="$(git show "$GENERATED_COMMIT:data/latest.json" | python -c 'import sys,json;print(json.load(sys.stdin)["generated_at_kst"])')"
          for attempt in 1 2 3; do
            git fetch origin main
            if git cat-file -e origin/main:data/latest.json 2>/dev/null; then
              REMOTE_TIME="$(git show origin/main:data/latest.json | python -c 'import sys,json;print(json.load(sys.stdin)["generated_at_kst"])')"
              if [[ "$REMOTE_TIME" > "$GENERATED_TIME" ]]; then
                echo "A newer forecast was already published; preserving the newer generation"
                exit 0
              fi
            fi
            # Never rebase generated JSON/MD/PDF text; it causes conflicts.
            # Apply this run's files on TOP of latest origin/main, preserving new code.
            git switch -C publish-generated origin/main
            git restore --source="$GENERATED_COMMIT" --staged --worktree -- "${DATA_FILES[@]}"
            if git diff --cached --quiet; then
              echo "All generated files already match main"
              exit 0
            fi
            git commit -m "Publish latest verified nationwide rain/snow PDF and data"
            if git push origin HEAD:main; then
              echo "Published latest weather PDF successfully"
              exit 0
            fi
            echo "Publication race; retrying against newest main"
            sleep 2
          done
          echo "Could not publish after safe retries"
          exit 1
