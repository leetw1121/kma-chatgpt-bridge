name: KMA forecast feed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "locations.csv"
      - "assets/**"
      - ".github/workflows/update_kma.yml"
  schedule:
    # Three independent slots per 6h alert cycle, before ChatGPT's :30 alert.
    # UTC 02/08/14/20:50 => KST 05/11/17/23:50;
    # UTC 03/09/15/21:10,20 => KST 00/06/12/18:10,20.
    # The earliest 17:50 run can capture the new 17:00 KMA forecast.
    # GitHub schedule runs are best-effort: some may be delayed or dropped.
    - cron: '50 2,8,14,20 * * *'
    - cron: '10,20 3,9,15,21 * * *'

permissions:
  contents: write

concurrency:
  group: kma-forecast-feed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate collector
        run: python -m unittest discover -s tests -v
      - name: Import official nationwide KMA grid mapping (if uploaded)
        run: |
          if [ -f assets/kma_grid_mapping.xlsx ]; then
            python -m pip install --disable-pip-version-check openpyxl
            python scripts/import_kma_grid.py assets/kma_grid_mapping.xlsx
          elif [ -f assets/kma_grid_mapping.csv ]; then
            python scripts/import_kma_grid.py assets/kma_grid_mapping.csv
          else
            echo "No official grid file uploaded; keeping verified representative sample."
          fi
      - name: Fetch official KMA forecasts
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
        run: python scripts/fetch_kma.py
      - name: Publish rain/snow forecast regions only (all qualifying regions, no TOP limit)
        run: python scripts/create_precip_report.py
      - name: Check independent ECMWF IFS / AIFS model availability
        run: python scripts/fetch_ecmwf.py
      - name: Generate date-sorted city-level rain/snow summary
        run: |
          python scripts/city_forecast.py
          test -s data/city_precipitation.md
          test -s data/city_precipitation.csv
      - name: Generate city-only PDF with verified seven-day ECMWF appendix
        run: |
          python -m pip install --quiet "reportlab>=4.0,<5"
          if [ ! -f /usr/share/fonts/truetype/nanum/NanumGothic.ttf ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq fonts-nanum
          fi
          python -m py_compile scripts/create_city_pdf.py
          python scripts/create_city_pdf.py
          test -s data/rain_snow_latest.pdf
          test "$(head -c 5 data/rain_snow_latest.pdf)" = "%PDF-"
      - name: Safely publish PDF and forecast data even when code changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATA_FILES=(
            data/latest.json data/summary.md data/all_regions.md data/all_regions.csv
            data/precipitation_only.md data/precipitation_only.csv
            data/city_precipitation.md data/city_precipitation.csv
            data/rain_snow_latest.pdf data/pdf_manifest.json
            data/ecmwf_regional.json data/ecmwf_last_verified.json data/source_status.md
          )
          git add "${DATA_FILES[@]}"
          if git diff --cached --quiet; then
            echo "No generated data changes"
            exit 0
          fi
          git commit -m "Stage generated KMA rain/snow PDF and forecasts"
          GENERATED_COMMIT="$(git rev-parse HEAD)"
          GENERATED_TIME="$(git show "$GENERATED_COMMIT:data/latest.json" | python -c 'import sys,json;print(json.load(sys.stdin)["generated_at_kst"])')"
          for attempt in 1 2 3; do
            git fetch origin main
            if git cat-file -e origin/main:data/latest.json 2>/dev/null; then
              REMOTE_TIME="$(git show origin/main:data/latest.json | python -c 'import sys,json;print(json.load(sys.stdin)["generated_at_kst"])')"
              if [[ "$REMOTE_TIME" > "$GENERATED_TIME" ]]; then
                echo "A newer forecast was already published; preserving the newer generation"
                exit 0
              fi
            fi
            # Never rebase generated JSON/MD/PDF text; it causes conflicts.
            # Apply this run's files on TOP of latest origin/main, preserving new code.
            git switch -C publish-generated origin/main
            git restore --source="$GENERATED_COMMIT" --staged --worktree -- "${DATA_FILES[@]}"
            if git diff --cached --quiet; then
              echo "All generated files already match main"
              exit 0
            fi
            git commit -m "Publish latest verified nationwide rain/snow PDF and data"
            if git push origin HEAD:main; then
              echo "Published latest weather PDF successfully"
              exit 0
            fi
            echo "Publication race; retrying against newest main"
            sleep 2
          done
          echo "Could not publish after safe retries"
          exit 1
