name: KMA forecast feed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "locations.csv"
      - "assets/**"
      - ".github/workflows/update_kma.yml"
  schedule:
    # KST 00:12/00:22,06:12/06:22,12:12/12:22,18:12/18:22 (redundant to reduce delayed runs)
    - cron: '12,22 3,9,15,21 * * *'

permissions:
  contents: write

concurrency:
  group: kma-forecast-feed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate collector
        run: python -m unittest discover -s tests -v
      - name: Import official nationwide KMA grid mapping (if uploaded)
        run: |
          if [ -f assets/kma_grid_mapping.xlsx ]; then
            python -m pip install --disable-pip-version-check openpyxl
            python scripts/import_kma_grid.py assets/kma_grid_mapping.xlsx
          elif [ -f assets/kma_grid_mapping.csv ]; then
            python scripts/import_kma_grid.py assets/kma_grid_mapping.csv
          else
            echo "No official grid file uploaded; keeping verified representative sample."
          fi
      - name: Fetch official KMA forecasts
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
        run: python scripts/fetch_kma.py
      - name: Commit PUBLIC weather data only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add locations.csv data/latest.json data/summary.md data/all_regions.md data/all_regions.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update KMA public weather forecast"
            git push
          fi
