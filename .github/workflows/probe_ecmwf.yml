name: Diagnose ECMWF Open-Meteo connectivity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "diagnostics/probe_weather_api.py"
      - ".github/workflows/probe_ecmwf.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Probe Open-Meteo DNS TLS HTTP using no credentials
        run: python -u diagnostics/probe_weather_api.py
